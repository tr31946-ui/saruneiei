
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศรัณย์พร พึ่งคล้าย</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background: linear-gradient(135deg, #ffc1dc, #c9b6ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #49304f;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 50px 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .profile {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ff8fc7, #a78bfa);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            color: white;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: #b44c91;
        }

        p {
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            background: #d66bab;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            transition: 0.3s;
        }

        .button:hover {
            background: #9656b5;
            transform: scale(1.05);
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="profile">♡</div>

        <h1>ศรัณย์พร พึ่งคล้าย</h1>

        <p>
            ยินดีต้อนรับเข้าสู่เว็บไซต์ของฉัน 🌷
            <br>
            เว็บไซต์แนะนำตัวและรวบรวมข้อมูลส่วนตัว
            <br>
            ขอบคุณที่เข้ามาเยี่ยมชมเว็บไซต์นะคะ
        </p>

        <a href="mailto:" class="button">ติดต่อฉัน</a>

        <footer>
            © 2026 ศรัณย์พร พึ่งคล้าย
            <br>
            All Rights Reserved.
        </footer>

    </div>

</body>
</html>
